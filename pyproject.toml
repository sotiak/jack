[project]
name = "mono"
version = "0.1.5"
description = "Build the Sotiak Mono programming font based on Iosevka and BIZ UD Gothic."
readme = "README.md"
license = "OFL-1.1"
license-files = ["LICENSE"]
authors = [
    { name = "sotiak", email = "35842766+sotiak@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fonttools[woff]==4.61.1",
    "pillow==13.0.0",
]

[project.scripts]
build = "mono.build:main"
site = "mono.site:main"
screenshots = "mono.screenshots:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.56,<2",
    "fontbakery>=1.1.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ty.analysis]
# fontTools and Pillow expose dynamic table APIs that ty cannot model precisely.
replace-imports-with-any = ["fontTools.**", "PIL.**"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=mono --cov-report=term-missing"
