[project]
name = "jack"
version = "0.1.0"
description = "Build the Back programming font from Hack and BIZ UD Gothic."
readme = "README.md"
authors = [
    { name = "sotiak", email = "35842766+sotiak@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fonttools==4.61.1",
    "pillow==13.0.0",
]

[project.scripts]
jack = "jack.build:main"
jack-fetch = "jack.fetch:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ty.analysis]
# fontTools and Pillow expose dynamic table APIs that ty cannot model precisely.
replace-imports-with-any = ["fontTools.**", "PIL.**"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jack --cov-report=term-missing"
