[project]
name = "jack"
version = "0.1.0"
description = "A Python application."
readme = "README.md"
authors = [
    { name = "sotiak", email = "35842766+sotiak@users.noreply.github.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = []

[project.scripts]
jack = "jack:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=jack --cov-report=term-missing"
